name: Scheduled Rebuild

# Hugoは「ビルドした瞬間の日付」で公開/非公開を判定するため、
# 未来日付の予約記事は公開日にもう一度ビルドしないと404になる。
# 毎朝空コミットをpushして、Cloudflare Pagesのビルドを起こす。

on:
  schedule:
    # GitHub Actions のスケジュールは混雑時に発火しないことがあるため、
    # 朝のうちに3回仕掛けておく（記事が出ていれば2回目以降は何もしない）。
    # UTC 21:00 = JST 6:00（前日UTCなので日本の朝6時）
    - cron: '0 21 * * *'
    - cron: '30 22 * * *'   # JST 7:30
    - cron: '0 0 * * *'     # JST 9:00
  workflow_dispatch:   # 手動実行もできるようにしておく

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 公開予定の記事があるか確認
        id: check
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          echo "今日（JST）: $TODAY"

          # front matterの date が今日の記事を探す
          HIT=$(grep -l "^date: ${TODAY}" content/posts/*.md 2>/dev/null || true)

          if [ -z "$HIT" ]; then
            echo "本日公開予定の記事なし"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "本日公開予定:"
          echo "$HIT"

          # すでに公開されていれば何もしない。
          # スケジュールを1日に何度か仕掛けているので、
          # この確認が無いと同じ記事で何度もビルドが走ってしまう。
          STILL=false
          for f in $HIT; do
            SLUG=$(basename "$f" .md)
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://zubora-neko.com/posts/${SLUG}/")
            echo "  ${SLUG} -> ${CODE}"
            [ "$CODE" = "200" ] || STILL=true
          done

          if [ "$STILL" = "true" ]; then
            echo "まだ公開されていないので再ビルドする"
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "すでに公開済みなので何もしない"
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: 空コミットで再ビルドを起こす
        if: steps.check.outputs.found == 'true'
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "自動再ビルド（${TODAY} 公開分）"
          git push
